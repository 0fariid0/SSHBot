<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>SSHBot · Workspace</title><link rel="stylesheet" href="/static/vendor/xterm.css"><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="/static/vendor/xterm.js"></script><script defer src="/static/vendor/addon-fit.js"></script><script defer src="/static/app.js"></script></head>
<body><div id="login" class="gate"><div class="brandicon">⌘</div><h1>SSHBot</h1><p id="login-message">در حال بررسی ورود امن…</p><small>فضای شخصی سرورها • نسخه ۶</small></div>
<div id="workspace" hidden><aside><div class="brand"><span class="brandicon">⌘</span><b>SSHBot <small>WORKSPACE</small></b></div><div class="navlabel">فضای کاری</div><nav><button data-page="hosts" class="selected">▦ <span>سرورها</span><small id="host-count">0</small></button><button data-page="credentials"><i class="key-icon"></i> <span>Keychain</span></button><button data-page="audit">◷ <span>فعالیت‌ها</span></button><button data-page="users" id="users-nav" hidden>♙ <span>دسترسی کاربران</span></button></nav><div class="sidebar-bottom"><span class="secure-dot"></span> فضای رمزنگاری‌شده<div id="identity"></div><button id="logout" class="quiet">خروج از حساب ↗</button></div></aside>
<main><header><div><div class="eyebrow">YOUR PRIVATE CLOUD</div><h1 id="page-title">سرورهای من</h1><p id="page-description">همه اتصال‌ها، یک جای مشخص.</p></div><button id="add" class="primary">+ افزودن سرور</button></header><section id="toolbar"><div class="search">⌕ <input id="search" placeholder="جست‌وجوی نام، IP، گروه یا یادداشت…"></div><select id="group"><option value="">همه گروه‌ها</option></select><button id="favorites" class="quiet">☆ علاقه‌مندی‌ها</button></section><div id="summary"></div><section id="content"></section><section id="terminal-area" hidden><div class="terminal-top"><div id="tabs"></div><button id="hide-terminal" class="quiet">کوچک کردن ⌄</button></div><div class="terminal-actions"><button data-key="\u0003">Ctrl C</button><button data-key="\u0018">Ctrl X</button><button data-key="\u0004">Ctrl D</button><button data-key="\t">Tab</button><button data-key="\u001b">Esc</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button id="paste">چسباندن</button><button id="save-output">ذخیره خروجی</button><button id="upload">آپلود فایل</button><button id="fullscreen">⛶</button></div><div id="terminals"></div><div class="terminal-footer"><span id="terminal-status">آماده</span><span>SSH · xterm-256color</span></div></section><button id="show-terminal" class="floating" hidden>باز کردن ترمینال‌ها ↑</button></main></div>
<dialog id="dialog"><form id="editor"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="quiet">✕</button></div><div id="fields"></div><p id="form-error" class="error"></p><div class="form-actions"><button type="button" id="cancel-dialog">انصراف</button><button type="submit" class="primary">ذخیره</button></div></form></dialog><input type="file" id="upload-file" multiple hidden><div id="toast" role="status" hidden></div></body></html>
